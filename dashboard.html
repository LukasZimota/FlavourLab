<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Meine Rezepte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader" class="loader-container">
        <div class="loader"></div>
        <p>Wir laden deine Kochbücher</p>
    </div>

    <header class="navbar content-hidden">
        <div class="navbar-container">
            <span class="navbar-brand">Flavour Lab</span>
            
            <button id="nav-toggle-btn" class="nav-toggle-btn" aria-label="Menü öffnen" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
                <span id="nav-toggle-notification" class_name="nav-toggle-notification-dot notification-dot-hidden"></span>
            </button>
        </div>
    </header>

    <nav id="nav-menu" class="navbar-tabs">
        <ul>
            <li><a href="dashboard.html" class="active">📚 Kochbücher</a></li>
            <li><a href="planner.html">📅 Wochenplaner</a></li>
            <li><a href="shopping-list.html">🛒 Einkaufsliste</a></li>
            <li>
                <a href="account.html">
                    👤 Konto
                    <span id="nav-account-notification" class="nav-menu-notification-dot notification-dot-hidden"></span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="main-content content-hidden">
        <div class="dashboard-container">
            
            <h2 id="dashboard-title">Willkommen zurück!</h2>

            <p id="gallery-message" class="message"></p>
            <div id="cookbook-gallery">
                </div>
        </div>
    </main>

    <div id="cookbook-modal" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <h3 id="modal-title">Neues Kochbuch erstellen</h3>
            <div id="new-cookbook-form" class="modal-form">
                <label for="modal-cookbook-name">Name des Kochbuchs</label>
                <input type="text" id="modal-cookbook-name" placeholder="z.B. Vegane Rezepte">
                <label for="modal-cookbook-image">Bild-URL (Optional)</label>
                <input type="text" id="modal-cookbook-image" placeholder="https://beispiel.com/bild.jpg">
                <button id="btn-save-cookbook">Speichern</button>
            </div>
        </div>
    </div>
    
    <div id="share-modal" class="modal-overlay modal-hidden">
        <div class="modal-content modal-small">
            <span id="share-modal-close-btn" class="modal-close">&times;</span>
            <h3 id="share-modal-title">Kochbuch teilen</h3>
            <p>Lade einen Nutzer per E-Mail ein, dieses Kochbuch mit dir zu bearbeiten.</p>
            <div id="share-cookbook-form" class="modal-form">
                <label for="modal-share-email">E-Mail des Nutzers</label>
                <input type="email" id="modal-share-email" placeholder="freund@email.de">
                <button id="btn-send-invite">Einladung senden</button>
                <p id="share-error-message" class="error"></p>
            </div>
        </div>
    </div>
    
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./app.js"></script>

    <script type="module">
      // Importiere auth und db, da wir sie hier brauchen
      import { auth, db } from './firebase-config.js';

      // Globale Variable für den Listener, damit wir ihn trennen können
      let invitationListener = null;

      // Funktion zum Umschalten des Menüs
      const setupNavToggle = () => {
        const navToggleBtn = document.getElementById('nav-toggle-btn');
        if (navToggleBtn) {
          navToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('nav-open');
            const isExpanded = navToggleBtn.getAttribute('aria-expanded') === 'true';
            navToggleBtn.setAttribute('aria-expanded', !isExpanded);
          });
        }
      };

      // Funktion zum Anzeigen/Verstecken der Punkte
      const updateNotificationDots = (hasInvites) => {
        const toggleDot = document.getElementById('nav-toggle-notification');
        const menuDot = document.getElementById('nav-account-notification');
        
        // Dieser Punkt existiert NUR auf account.html, aber wir suchen trotzdem danach
        const accountPageDot = document.getElementById('account-invites-notification');

        if (hasInvites) {
          if (toggleDot) toggleDot.classList.remove('notification-dot-hidden');
          if (menuDot) menuDot.classList.remove('notification-dot-hidden');
          if (accountPageDot) accountPageDot.classList.remove('notification-dot-hidden');
        } else {
          if (toggleDot) toggleDot.classList.add('notification-dot-hidden');
          if (menuDot) menuDot.classList.add('notification-dot-hidden');
          if (accountPageDot) accountPageDot.classList.add('notification-dot-hidden');
        }
      };

      // Funktion, die auf neue Einladungen hört
      const listenForInvites = (userId) => {
        // Trenne alten Listener, falls vorhanden
        if (invitationListener) {
          invitationListener();
        }

        // Erstelle die Echtzeit-Query
        const invitesQuery = db.collection("invitations")
            .where("toUserId", "==", userId)
            .where("status", "==", "pending");

        // Starte den Echtzeit-Listener
        invitationListener = invitesQuery.onSnapshot((snapshot) => {
            console.log(`Notification-Check: ${snapshot.size} Einladungen gefunden.`);
            updateNotificationDots(!snapshot.empty); // Zeige/verstecke Punkte
        }, (error) => {
            console.error("Fehler im Benachrichtigungs-Listener:", error);
            updateNotificationDots(false); // Bei Fehler sicherheitshalber verstecken
        });
      };

      // Auth-Wächter, der alles startet
      auth.onAuthStateChanged((user) => {
        if (user) {
          // Nutzer ist eingeloggt, starte den Listener
          listenForInvites(user.uid);
        } else {
          // Nutzer ist ausgeloggt, trenne Listener und verstecke Punkte
          if (invitationListener) {
            invitationListener();
            invitationListener = null;
          }
          updateNotificationDots(false);
        }
      });

      // Starte den Menü-Toggle-Listener, sobald das DOM geladen ist
      document.addEventListener('DOMContentLoaded', setupNavToggle);
    </script>

</body>
</html>
